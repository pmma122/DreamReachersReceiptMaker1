* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Segoe UI', Arial, sans-serif; background: #f0f4f8; min-height: 100vh; padding: 20px 16px 40px; color: #222; }
h1 { text-align: center; font-size: 20px; font-weight: 700; color: #1a7da8; margin-bottom: 2px; }
.subtitle { text-align: center; font-size: 13px; color: #999; margin-bottom: 20px; }
.app { display: flex; flex-direction: column; gap: 20px; max-width: 480px; margin: 0 auto; }
.card { background: #fff; border-radius: 16px; box-shadow: 0 2px 16px rgba(0,0,0,0.08); padding: 20px; }
.section-title { font-size: 11px; font-weight: 700; color: #bbb; text-transform: uppercase; letter-spacing: 0.07em; margin-bottom: 14px; }
.school-toggle { display: flex; gap: 8px; margin-bottom: 18px; }
.school-btn { flex: 1; padding: 10px 6px; border-radius: 12px; border: 2px solid #e4e8ed; background: #f8fafc; font-size: 12px; font-weight: 600; cursor: pointer; transition: all 0.2s; color: #888; text-align: center; }
.school-btn.active-lang  { border-color: #29abe2; background: #e8f6fd; color: #1a7da8; }
.school-btn.active-write { border-color: #e26a29; background: #fdf1e8; color: #a84a1a; }
.school-btn.active-exam  { border-color: #7c3aed; background: #f0ebfd; color: #5b21b6; }
.field { margin-bottom: 12px; }
.field label { display: block; font-size: 13px; color: #666; margin-bottom: 4px; font-weight: 500; }
.field input, .field select { width: 100%; border: 1.5px solid #e4e8ed; border-radius: 10px; padding: 10px 13px; font-size: 15px; color: #222; outline: none; background: #fff; transition: border 0.2s; -webkit-appearance: none; }
.field input:focus, .field select:focus { border-color: #29abe2; }
.field select { cursor: pointer; }
.font-preview { font-size: 22px; color: #222; margin-top: 6px; padding: 4px 2px; min-height: 34px; }
.date-rows { display: flex; flex-direction: column; gap: 8px; margin-bottom: 12px; }
.date-row { display: flex; align-items: center; gap: 8px; }
.date-row input { flex: 1; border: 1.5px solid #e4e8ed; border-radius: 10px; padding: 9px 12px; font-size: 14px; color: #222; outline: none; background: #fff; }
.date-row input:focus { border-color: #29abe2; }
.date-row label { font-size: 12px; color: #888; white-space: nowrap; width: 50px; font-weight: 600; }
.add-date-btn, .rem-date-btn { background: none; border: 1.5px solid #e4e8ed; border-radius: 8px; width: 30px; height: 30px; font-size: 16px; cursor: pointer; color: #888; display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: all 0.15s; }
.add-date-btn:hover { border-color: #29abe2; color: #29abe2; }
.rem-date-btn:hover { border-color: #e24229; color: #e24229; }
.btn { width: 100%; padding: 13px; font-size: 15px; font-weight: 600; cursor: pointer; border-radius: 12px; border: none; margin-top: 10px; transition: background 0.2s, transform 0.1s; -webkit-appearance: none; }
.btn:active { transform: scale(0.98); }
.btn-jpg { background: #29abe2; color: #fff; }
.btn-jpg:hover { background: #1a8fc4; }
.btn-jpg:disabled { background: #a0d4ed; cursor: not-allowed; }
.btn-print { background: #f0f4f8; color: #555; border: 1.5px solid #dde3ea; }
.btn-print:hover { background: #e4eaf0; }
.preview-label { font-size: 11px; font-weight: 700; color: #bbb; text-transform: uppercase; letter-spacing: 0.07em; margin-bottom: 14px; }
#receipt-preview { background: #fff; border: 1px solid #e4eaf0; border-radius: 12px; padding: 28px 36px 24px; font-family: Arial, sans-serif; color: #222; width: 660px; max-width: 660px; box-sizing: border-box; }
.r-logo { text-align: center; margin-bottom: 8px; }
.r-logo img { width: 100px; height: 100px; border-radius: 50%; object-fit: cover; display: block; margin: 0 auto; }
.r-school { font-size: 20px; font-weight: 700; color: #111; text-align: center; margin: 10px 0 2px; line-height: 1.3; }
.r-heading { font-size: 18px; font-weight: 700; color: #29abe2; text-align: center; margin: 0 0 18px; }
.r-heading.write { color: #e26a29; }
.r-heading.exam  { color: #7c3aed; }
.r-divider { border: none; border-top: 1px solid #eee; margin: 0 0 16px; }
.r-table { width: 100%; border-collapse: collapse; }
.r-table tr { vertical-align: top; }
.r-table td { padding: 5px 0; font-size: 15px; line-height: 1.6; }
.r-table td.lbl { font-weight: 700; white-space: nowrap; width: 64px; color: #111; }
.r-table td.col { padding: 5px 10px; white-space: nowrap; color: #999; width: 12px; }
.r-table td.val { color: #333; word-break: break-word; }
.r-sig { text-align: right; margin-top: 22px; padding-top: 14px; border-top: 1px solid #eee; font-size: 13px; color: #666; }
.sig-script { font-family: Georgia, serif; font-style: italic; font-size: 22px; color: #222; margin-left: 6px; }
#pwa-banner { display: none; position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #1a7da8; color: #fff; border-radius: 14px; padding: 12px 22px; font-size: 14px; font-weight: 600; box-shadow: 0 4px 20px rgba(0,0,0,0.18); cursor: pointer; z-index: 9999; border: none; white-space: nowrap; align-items: center; gap: 10px; }
#pwa-banner.show { display: flex; animation: slideUp 0.4s ease; }
#pwa-dismiss { background: rgba(255,255,255,0.2); border: none; color: #fff; border-radius: 8px; padding: 4px 10px; cursor: pointer; font-size: 13px; }
@keyframes slideUp { from { opacity:0; transform: translateX(-50%) translateY(20px); } to { opacity:1; transform: translateX(-50%) translateY(0); } }
@media (min-width: 820px) { .app { flex-direction: row; align-items: flex-start; max-width: 900px; } .panel { flex: 1; } .panel:last-child { overflow-x: auto; } }
</style>
</head>
<body>

<h1>Dream Reachers Receipt Maker</h1>
<p class="subtitle">Language &bull; Writing &bull; Exam School</p>

<div class="app">
  <div class="panel">
    <div class="card">
      <p class="section-title">School</p>
      <div class="school-toggle">
        <button class="school-btn active-lang" id="btn-lang" onclick="setSchool('language')">&#127760; Language</button>
        <button class="school-btn" id="btn-write" onclick="setSchool('writing')">&#9997;&#65039; Writing</button>
        <button class="school-btn" id="btn-exam" onclick="setSchool('exam')">&#127891; Exam</button>
      </div>
      <p class="section-title">Receipt Details</p>
      <div class="field"><label>Student name</label><input type="text" id="f-name" placeholder="e.g. Myat Eaindray Lwin" oninput="update()" /></div>
      <div class="field"><label>Alias / @ name (optional)</label><input type="text" id="f-alias" placeholder="e.g. Amelia" oninput="update()" /></div>
      <div class="field"><label>FB name (optional)</label><input type="text" id="f-fb" placeholder="e.g. Lwin Wai Phyo" oninput="update()" /></div>
      <div class="field">
        <label>Date(s)</label>
        <div class="date-rows" id="date-rows">
          <div class="date-row" id="date-row-1">
            <label style="width:50px;font-size:12px;color:#888;font-weight:600;">Date</label>
            <input type="date" id="f-date-1" oninput="update()" />
            <button class="add-date-btn" onclick="addDate()" title="Add date">+</button>
          </div>
        </div>
      </div>
      <div class="field"><label>Class 1</label><input type="text" id="f-class" placeholder="e.g. Lower Venus Two B" oninput="update()" /></div>
      <div class="field"><label>Terms 1 (optional)</label><input type="text" id="f-terms" placeholder="e.g. Term 2,3,4" oninput="update()" /></div>
      <div class="field"><label>Class 2 (optional)</label><input type="text" id="f-class2" placeholder="e.g. Upper Mars One A" oninput="update()" /></div>
      <div class="field"><label>Terms 2 (optional)</label><input type="text" id="f-terms2" placeholder="e.g. Term 1,2,3" oninput="update()" /></div>
      <div class="field"><label>Fees (MMK)</label><input type="text" id="f-fees" placeholder="e.g. 195,000" oninput="update()" /></div>
      <div class="field"><label>Fee note (optional)</label><input type="text" id="f-fterms" placeholder="e.g. 3 Terms" oninput="update()" /></div>
      <div class="field"><label>Signature text</label><input type="text" id="f-sig" placeholder="e.g. pmma" value="pmma" oninput="update()" /></div>
      <div class="field">
        <label>Signature font</label>
        <select id="f-sigfont" onchange="updateSigFont()">
          <option value="Dancing Script">Dancing Script</option>
          <option value="Great Vibes">Great Vibes</option>
          <option value="Pacifico">Pacifico</option>
          <option value="Satisfy">Satisfy</option>
          <option value="Pinyon Script">Pinyon Script</option>
          <option value="Sacramento">Sacramento</option>
          <option value="Allura">Allura</option>
          <option value="Caveat">Caveat</option>
          <option value="Georgia">Georgia (default)</option>
        </select>
        <div class="font-preview" id="sig-font-preview" style="font-family:'Dancing Script',cursive;">pmma</div>
      </div>
      <button class="btn btn-jpg" id="btn-dl" onclick="downloadJPG()">&#8681; Download as JPG</button>
      <button class="btn btn-print" onclick="printReceipt()">&#128424; Print</button>
    </div>
  </div>

  <div class="panel">
    <div class="card">

  document.getElementById('r-logo-img').src = LOGOS[type];
  document.getElementById('r-school-name').textContent = NAMES[type];
  var heading = document.getElementById('r-heading');
  heading.className = 'r-heading';
  if (type === 'writing') heading.className += ' write';
  if (type === 'exam')    heading.className += ' exam';
  document.getElementById('btn-lang').className  = 'school-btn';
  document.getElementById('btn-write').className = 'school-btn';
  document.getElementById('btn-exam').className  = 'school-btn';
  if (type === 'language') document.getElementById('btn-lang').className  += ' active-lang';
  if (type === 'writing')  document.getElementById('btn-write').className += ' active-write';
  if (type === 'exam')     document.getElementById('btn-exam').className  += ' active-exam';
  update();
}

function addDate() {
  if (dateCount >= 3) return;
  dateCount++;
  var container = document.getElementById('date-rows');
  var prevRows = container.querySelectorAll('.date-row');
  prevRows.forEach(function(r) { var b = r.querySelector('.add-date-btn'); if(b) b.remove(); });
  var row = document.createElement('div');
  row.className = 'date-row';
  row.id = 'date-row-' + dateCount;
  var inner = '<label style="width:50px;font-size:12px;color:#888;font-weight:600;">Date ' + dateCount + '</label>';
  inner += '<input type="date" id="f-date-' + dateCount + '" oninput="update()" />';
  inner += '<button class="rem-date-btn" onclick="removeDate(' + dateCount + ')" title="Remove">&#8722;</button>';
  if (dateCount < 3) inner += '<button class="add-date-btn" onclick="addDate()" title="Add date">+</button>';
  row.innerHTML = inner;
  container.appendChild(row);
  document.getElementById('date-row-1').querySelector('label').textContent = 'Date 1';
  update();
}

function removeDate(n) {
  var row = document.getElementById('date-row-' + n);
  if (row) row.remove();
  dateCount--;
  var container = document.getElementById('date-rows');
  var rows = container.querySelectorAll('.date-row');
  rows.forEach(function(r, i) {
    var idx = i + 1;
    r.id = 'date-row-' + idx;
    r.querySelector('label').textContent = (dateCount === 1) ? 'Date' : 'Date ' + idx;
    var inp = r.querySelector('input'); inp.id = 'f-date-' + idx;
    var rem = r.querySelector('.rem-date-btn');
    if (rem) rem.setAttribute('onclick', 'removeDate(' + idx + ')');
  });
  var lastRow = rows[rows.length - 1];
  if (lastRow && !lastRow.querySelector('.add-date-btn') && dateCount < 3) {
    var addBtn = document.createElement('button');
    addBtn.className = 'add-date-btn'; addBtn.title = 'Add date'; addBtn.textContent = '+';
    addBtn.setAttribute('onclick', 'addDate()');
    lastRow.appendChild(addBtn);
  }
  update();
}

function fmt(d) {
  if (!d) return '';
  return new Date(d + 'T00:00:00').toLocaleDateString('en-US', {year:'numeric',month:'long',day:'numeric'});
}

function update() {
  var name  = document.getElementById('f-name').value.trim();
  var fb    = document.getElementById('f-fb').value.trim();
  var alias = document.getElementById('f-alias').value.trim();
  var cls   = document.getElementById('f-class').value.trim();
  var terms = document.getElementById('f-terms').value.trim();
  var cls2  = document.getElementById('f-class2').value.trim();
  var terms2= document.getElementById('f-terms2').value.trim();
  var fees  = document.getElementById('f-fees').value.trim();
  var fterms= document.getElementById('f-fterms').value.trim();
  var nameStr = name || '—';
  if (alias) nameStr += ' @' + alias;
  if (fb)    nameStr += ' (FB: ' + fb + ')';
  document.getElementById('p-name').textContent = nameStr;
  var dateVals = [];
  for (var i = 1; i <= 3; i++) {
    var inp = document.getElementById('f-date-' + i);
    if (inp && inp.value) dateVals.push(fmt(inp.value));
  }
  document.getElementById('r-date-lbl').textContent = dateVals.length > 1 ? 'Dates' : 'Date';
  document.getElementById('p-dates').textContent = dateVals.length ? dateVals.join(',  ') : '—';
  var classStr = cls || '—';
  if (terms) classStr += ' (' + terms + ')';
  document.getElementById('p-class').textContent = classStr;
  var row2 = document.getElementById('row-class2');
  if (cls2) {
    var c2 = cls2; if (terms2) c2 += ' (' + terms2 + ')';
    document.getElementById('p-class2').textContent = c2;
    row2.style.display = 'table-row';
  } else { row2.style.display = 'none'; }
  var feesStr = fees ? fees + ' MMK' : '—';
  if (fterms) feesStr += ' (For ' + fterms + ')';
  document.getElementById('p-fees').textContent = feesStr;
  var sig = document.getElementById('f-sig').value || 'pmma';
  document.getElementById('p-sig').textContent = sig;
  document.getElementById('sig-font-preview').textContent = sig;
}

function updateSigFont() {
  var font = document.getElementById('f-sigfont').value;
  var sigEl = document.getElementById('p-sig');
  var previewEl = document.getElementById('sig-font-preview');
  sigEl.style.fontFamily = "'" + font + "', cursive";
  previewEl.style.fontFamily = "'" + font + "', cursive";
}

function downloadJPG() {
  var btn = document.getElementById('btn-dl');
  btn.disabled = true; btn.textContent = 'Generating…';
  html2canvas(document.getElementById('receipt-preview'), {scale:3, backgroundColor:'#ffffff', useCORS:true}).then(function(canvas) {
    var name = document.getElementById('f-name').value.trim().replace(/\s+/g,'_') || 'receipt';
    var a = document.createElement('a');
    a.download = 'receipt_' + name + '.jpg';
    a.href = canvas.toDataURL('image/jpeg', 0.95);
    a.click();
    btn.disabled = false; btn.textContent = '\u2B07 Download as JPG';
  });
}

// PWA install prompt
var deferredPrompt = null;
var banner = document.getElementById('pwa-banner');
window.addEventListener('beforeinstallprompt', function(e) {
  e.preventDefault();
  deferredPrompt = e;
  banner.classList.add('show');
});
banner.addEventListener('click', function(e) {
  if (e.target.id === 'pwa-dismiss') return;
  if (!deferredPrompt) return;
  deferredPrompt.prompt();
  deferredPrompt.userChoice.then(function() {
    deferredPrompt = null;
    banner.classList.remove('show');
  });
});
window.addEventListener('appinstalled', function() {
  banner.classList.remove('show');
});
function dismissBanner(e) {
  e.stopPropagation();
  banner.classList.remove('show');
}

// Manifest + Service Worker via Blob
(function() {
  var manifest = {
    name: 'Dream Reachers Receipt Maker',
    short_name: 'DR Receipt',
    start_url: '.',
    display: 'standalone',
    background_color: '#f0f4f8',
    theme_color: '#1a7da8',
    icons: [{src: document.getElementById('r-logo-img').src, sizes:'192x192', type:'image/jpeg'}]
  };
  var mBlob = new Blob([JSON.stringify(manifest)], {type:'application/json'});
  var mLink = document.createElement('link');
  mLink.rel = 'manifest'; mLink.href = URL.createObjectURL(mBlob);
  document.head.appendChild(mLink);

  if ('serviceWorker' in navigator) {
    var swCode = "const CACHE='dr-receipt-v1';self.addEventListener('install',e=>{self.skipWaiting();});self.addEventListener('activate',e=>{e.waitUntil(self.clients.claim());});self.addEventListener('fetch',e=>{e.respondWith(caches.match(e.request).then(r=>r||fetch(e.request).then(res=>{return caches.open(CACHE).then(c=>{c.put(e.request,res.clone());return res;});}).catch(()=>new Response('Offline'))));});";
    var swBlob = new Blob([swCode], {type:'text/javascript'});
    navigator.serviceWorker.register(URL.createObjectURL(swBlob)).catch(function(){});
  }
})();
