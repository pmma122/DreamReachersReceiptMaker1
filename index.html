<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Dream Reachers Receipt Maker</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', Arial, sans-serif; background: #f0f4f8; min-height: 100vh; padding: 20px 16px 40px; color: #222; }
  h1 { text-align: center; font-size: 20px; font-weight: 700; color: #1a7da8; margin-bottom: 2px; }
  .subtitle { text-align: center; font-size: 13px; color: #999; margin-bottom: 20px; }

  .app { display: flex; flex-direction: column; gap: 20px; max-width: 480px; margin: 0 auto; }

  .card { background: #fff; border-radius: 16px; box-shadow: 0 2px 16px rgba(0,0,0,0.08); padding: 20px; }
  .section-title { font-size: 11px; font-weight: 700; color: #bbb; text-transform: uppercase; letter-spacing: 0.07em; margin-bottom: 14px; }

  .field { margin-bottom: 12px; }
  .field label { display: block; font-size: 13px; color: #666; margin-bottom: 4px; font-weight: 500; }
  .field input {
    width: 100%; border: 1.5px solid #e4e8ed; border-radius: 10px;
    padding: 10px 13px; font-size: 15px; color: #222; outline: none;
    transition: border 0.2s; -webkit-appearance: none;
  }
  .field input:focus { border-color: #29abe2; }

  .btn {
    width: 100%; padding: 13px; font-size: 15px; font-weight: 600;
    cursor: pointer; border-radius: 12px; border: none; margin-top: 10px;
    transition: background 0.2s, transform 0.1s; -webkit-appearance: none;
  }
  .btn:active { transform: scale(0.98); }
  .btn-jpg { background: #29abe2; color: #fff; }
  .btn-jpg:hover { background: #1a8fc4; }
  .btn-jpg:disabled { background: #a0d4ed; cursor: not-allowed; }
  .btn-print { background: #f0f4f8; color: #555; border: 1.5px solid #dde3ea; }
  .btn-print:hover { background: #e4eaf0; }

  .preview-label { font-size: 11px; font-weight: 700; color: #bbb; text-transform: uppercase; letter-spacing: 0.07em; margin-bottom: 14px; }

  /* Receipt card — fixed proportions matching the printed receipt */
  #receipt-preview {
    background: #fff;
    border: 1px solid #e4eaf0;
    border-radius: 12px;
    padding: 28px 36px 24px;
    font-family: Arial, sans-serif;
    color: #222;
    width: 660px;
    max-width: 660px;
    box-sizing: border-box;
  }
  .r-logo { text-align: center; margin-bottom: 8px; }
  .r-logo img { width: 110px; height: auto; border-radius: 0; display: block; margin: 0 auto; }
  .r-school { font-size: 20px; font-weight: 700; color: #111; text-align: center; margin: 10px 0 2px; line-height: 1.3; }
  .r-heading { font-size: 18px; font-weight: 700; color: #29abe2; text-align: center; margin: 0 0 18px; }
  .r-divider { border: none; border-top: 1px solid #eee; margin: 0 0 16px; }

  .r-table { width: 100%; border-collapse: collapse; }
  .r-table tr { vertical-align: top; }
  .r-table td { padding: 5px 0; font-size: 15px; line-height: 1.6; }
  .r-table td.lbl { font-weight: 700; white-space: nowrap; width: 64px; color: #111; }
  .r-table td.col { padding: 5px 10px; white-space: nowrap; color: #999; width: 12px; }
  .r-table td.val { color: #333; word-break: break-word; }

  .r-sig { text-align: right; margin-top: 22px; padding-top: 14px; border-top: 1px solid #eee; font-size: 13px; color: #666; }
  .sig-script { font-family: Georgia, serif; font-style: italic; font-size: 22px; color: #222; margin-left: 6px; }

  @media (min-width: 820px) {
    .app { flex-direction: row; align-items: flex-start; max-width: 860px; }
    .panel { flex: 1; }
  .panel:last-child { overflow-x: auto; }
  }
</style>
</head>
<body>

<h1>Dream Reachers Language School</h1>
<p class="subtitle">Receipt Maker</p>

<div class="app">
  <div class="panel">
    <div class="card">
      <p class="section-title">Receipt details</p>
      <div class="field"><label>Student name</label><input type="text" id="f-name" placeholder="e.g. Myat Eaindray Lwin" oninput="update()" /></div>
      <div class="field"><label>Alias / @ name (optional)</label><input type="text" id="f-alias" placeholder="e.g. Amelia" oninput="update()" /></div>
      <div class="field"><label>FB name (optional)</label><input type="text" id="f-fb" placeholder="e.g. Lwin Wai Phyo" oninput="update()" /></div>
      <div class="field"><label>Date</label><input type="date" id="f-date" oninput="update()" /></div>
      <div class="field"><label>Class 1</label><input type="text" id="f-class" placeholder="e.g. Lower Venus Two B" oninput="update()" /></div>
      <div class="field"><label>Terms 1 (e.g. Term 2,3,4)</label><input type="text" id="f-terms" placeholder="e.g. Term 2,3,4" oninput="update()" /></div>
      <div class="field"><label>Class 2 (optional)</label><input type="text" id="f-class2" placeholder="e.g. Upper Mars One A" oninput="update()" /></div>
      <div class="field"><label>Terms 2 (optional)</label><input type="text" id="f-terms2" placeholder="e.g. Term 1,2,3" oninput="update()" /></div>
      <div class="field"><label>Fees (MMK)</label><input type="text" id="f-fees" placeholder="e.g. 195,000" oninput="update()" /></div>
      <div class="field"><label>Fee note (e.g. For 3 Terms)</label><input type="text" id="f-fterms" placeholder="e.g. 3 Terms" oninput="update()" /></div>
      <button class="btn btn-jpg" id="btn-dl" onclick="downloadJPG()">⬇ Download as JPG</button>
      <button class="btn btn-print" onclick="printReceipt()">🖨 Print</button>
    </div>
  </div>

        <div class="r-school">Dream Reachers Language School</div>
        <div class="r-heading">Receipt</div>
        <hr class="r-divider" />
        <table class="r-table">
          <tr><td class="lbl">Name</td><td class="col">:</td><td class="val" id="p-name">—</td></tr>
          <tr><td class="lbl">Date</td><td class="col">:</td><td class="val" id="p-date">—</td></tr>
          <tr><td class="lbl">Class</td><td class="col">:</td><td class="val" id="p-class">—</td></tr>
          <tr id="row-class2" style="display:none"><td class="lbl">Class 2</td><td class="col">:</td><td class="val" id="p-class2"></td></tr>
          <tr><td class="lbl">Fees</td><td class="col">:</td><td class="val" id="p-fees">—</td></tr>
        </table>
        <div class="r-sig">Signature: <span class="sig-script">pmma</span></div>
      </div>
    </div>
  </div>
</div>

<script>
  document.getElementById('f-date').value = new Date().toISOString().split('T')[0];
  function fmt(d) {
    if (!d) return '—';
    return new Date(d + 'T00:00:00').toLocaleDateString('en-US', { year:'numeric', month:'long', day:'numeric' });
  }
  function update() {
    const name=document.getElementById('f-name').value.trim();
    const fb=document.getElementById('f-fb').value.trim();
    const alias=document.getElementById('f-alias').value.trim();
    const date=document.getElementById('f-date').value;
    const cls=document.getElementById('f-class').value.trim();
    const terms=document.getElementById('f-terms').value.trim();
    const cls2=document.getElementById('f-class2').value.trim();
    const terms2=document.getElementById('f-terms2').value.trim();
    const fees=document.getElementById('f-fees').value.trim();
    const fterms=document.getElementById('f-fterms').value.trim();
    let nameStr=name||'—';
    if(alias) nameStr+='@'+alias;
    if(fb) nameStr+=' (FB Name: '+fb+')';
    document.getElementById('p-name').textContent=nameStr;
    document.getElementById('p-date').textContent=fmt(date);
    let classStr=cls||'—';
    if(terms) classStr+=' ('+terms+')';
    document.getElementById('p-class').textContent=classStr;
    const row2=document.getElementById('row-class2');
    if(cls2){
      let classStr2=cls2;
      if(terms2) classStr2+=' ('+terms2+')';
      document.getElementById('p-class2').textContent=classStr2;
      row2.style.display='table-row';
    } else {
      row2.style.display='none';
    }
    let feesStr=fees?fees+' MMK':'—';
    if(fterms) feesStr+=' (For '+fterms+')';
    document.getElementById('p-fees').textContent=feesStr;
  }
  function downloadJPG() {
    const btn=document.getElementById('btn-dl');
    btn.disabled=true; btn.textContent='Generating…';
    html2canvas(document.getElementById('receipt-preview'),{scale:3,backgroundColor:'#ffffff',useCORS:true}).then(canvas=>{
      const name=document.getElementById('f-name').value.trim().replace(/\s+/g,'_')||'receipt';
      const a=document.createElement('a');
      a.download='receipt_'+name+'.jpg';
      a.href=canvas.toDataURL('image/jpeg',0.95);
      a.click();
      btn.disabled=false; btn.textContent='⬇ Download as JPG';
    });
  }
  function printReceipt() {
    const el=document.getElementById('receipt-preview');
    const w=window.open('','_blank','width=480,height=600');
    w.document.write('<html><head><title>Receipt</title><style>body{margin:40px;font-family:Arial,sans-serif;color:#222;max-width:400px;}.r-logo{text-align:center;margin-bottom:8px;}.r-logo img{width:110px;height:auto;display:block;margin:0 auto;}.r-school{font-size:17px;font-weight:700;text-align:center;margin:10px 0 2px;}.r-heading{font-size:16px;font-weight:700;color:#29abe2;text-align:center;margin:0 0 16px;}.r-divider{border:none;border-top:1px solid #eee;margin:0 0 14px;}table{width:100%;border-collapse:collapse;}td{padding:5px 0;font-size:14px;vertical-align:top;}.lbl{font-weight:700;width:52px;white-space:nowrap;}.col{padding:5px 10px;white-space:nowrap;color:#999;width:12px;}.val{color:#333;word-break:break-word;}.r-sig{text-align:right;margin-top:20px;padding-top:12px;border-top:1px solid #eee;font-size:13px;color:#666;}.sig-script{font-family:Georgia,serif;font-style:italic;font-size:22px;color:#222;margin-left:6px;}</style></head><body>');
    w.document.write(el.outerHTML);
    w.document.write('</body></html>');
    w.document.close(); w.focus();
    setTimeout(()=>w.print(),400);
  }
  update();
</script>
</body>
</html>
